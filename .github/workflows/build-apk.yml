name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "TWS-Audio-Analyzer-v${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TWS-Audio-Analyzer-v${{ env.VERSION_NAME }}
          path: TWS-Audio-Analyzer-*.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: TWS Audio Analyzer v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: TWS-Audio-Analyzer-*.apk
          body: |
            Download file **.apk** di bawah, lalu buka di HP Android (Android 10+) untuk install.
            Jika muncul peringatan "sumber tidak dikenal", izinkan browser/Files untuk menginstal aplikasi.
